      <div class="glass-card glass-sub">

        <label class="buffer" for="coding-challenge">
          <h3 class="expand">
            <img class="peek" src="static/img/codeadventure.png" alt="Code Adventure">
            Practical Python Code Adventure
            <a href="https://github.com/JefeThePug/Practical-Python-Code-Adventure"
               title="Visit Practical Python Coding Adventure GitHub Repo" target="_blank">
              <iconify-icon class="md-link" icon="bxl:github"></iconify-icon>
            </a>
          </h3>

          <div class="tray game">
            <div class="terminalHolder">
              <div>
                <a href="https://adventure.practicalpython.org">
                  <img class="project-img" src="static/img/codeadventure.png"
                       alt="Practical Python Code Adventure Logo"/>
                </a>
              </div>
            </div>

            <div class="description">
              <p>
                Practical Python Code Adventure is a series of 10 interactive coding challenges, each with two parts,
                inspired by Advent of Code. Built with Flask, this application allows users to log in via
                Discord, track their progress, and gain access to exclusive discussion channels upon completing
                challenges.
                <br/><span class="bold">This project is currently
                          <a href=https://adventure.practicalpython.org">LIVE on the Practical Python website</a></span>.
                Come and join in on the challenges!
              </p>

              <h3>Key Features:</h3>
              <ul>
                <li>Interactive Challenges:
                  <ul>
                    <li>
                      Engage with coding problems that test your skills and creativity based on common
                      algorithms and data structures.
                    </li>
                    <li>
                      Each challenge consists of two parts, allowing for independent problem-solving.
                    </li>
                    <li>
                      The development of these challenges showcases my ability to create educational
                      content that is both engaging and instructive. Demonstrating not only my ability
                      to solve these types of challenges but also build them from scratch.
                    </li>
                  </ul>
                </li>
                <li>Discord Integration:
                  <ul>
                    <li>
                      Seamless login through Discord OAuth for easy progress tracking.
                    </li>
                    <li>
                      Grants access to exclusive discussion channels on Discord upon completing challenges.
                    </li>
                  </ul>
                </li>
                <li>Dynamic Content:
                  <ul>
                    <li>
                      Challenges and solutions are stored in a PostgreSQL database for easy updates.
                    </li>
                    <li>
                      Content can be modified without disrupting user experience.
                    </li>
                  </ul>
                </li>
                <li>Obfuscation:
                  <ul>
                    <li>
                      Unique challenge identifiers add an element of mystery and prevent cheating.
                    </li>
                  </ul>
                </li>
                <li>Admin Dashboard:
                  <ul>
                    <li>
                      Feature-rich dashboard with a clean, intuitive UI/UX, enabling administrators to
                      seamlessly manage web app content and perform real-time updates to the database.
                    </li>
                  </ul>
                </li>
              </ul>

              <h3>Skills and Technologies Used:</h3>
              <ul>
                <li>
                  <span class="bold">Flask:</span> Utilized as the web framework for building the application,
                  enabling efficient routing and session management.
                </li>
                <li>
                  <span class="bold">Python:</span> Employed for backend development, including challenge
                  logic and user authentication.
                </li>
                <li>
                  <span class="bold">PostgreSQL:</span> Used for storing challenge data, user progress, and
                  solutions dynamically.
                </li>
                <li>
                  <span class="bold">HTML/CSS:</span> Implemented for creating a user-friendly interface and
                  ensuring responsive design.
                </li>
                <li>
                  <span class="bold">Docker:</span> Dockerized to work with Docker Compose and integrate
                  easily with AWS EC2.
                </li>
                <li>
                  <span class="bold">JavaScript:</span> Used for enhancing interactivity and improving user
                  experience through dynamic content updates.
                </li>
              </ul>

              <p>
                This project not only showcases my coding proficiency but also highlights my ability to teach
                and create content independently. By developing challenges that are both challenging and
                educational, I demonstrate a commitment to enhancing the learning experience for users. The
                focus on usability and engagement makes it a valuable tool for users looking to sharpen their
                coding skills.
              </p>

      <div class="glass-card glass-sub">
        <input type="checkbox" id="calculator"/>
        <label class="buffer" for="calculator">
          <h3 class="expand">
            <img class="peek" src="static/img/calc.png" alt="Calculator">
            PyQT Calculator
            <a href="https://github.com/JefeThePug/calculator" title="Visit Calculator GitHub Repo" target="_blank">
              <iconify-icon class="md-link" icon="bxl:github"></iconify-icon>
            </a>
          </h3>

          <div class="tray game">
            <div class="terminalHolder">
              <div id="calc-container">
                <div id="calculator-box">
                  <div class="input-container">
                    <input type="text" id="expression" placeholder="0" readonly>
                    <div class="memory">M</div>
                  </div>
                  <div class="button-container">
                    <button class="red" sent="AC" py-click="CALCULATOR.clicked_button">AC</button>
                    <button class="red" sent="MR" py-click="CALCULATOR.clicked_button">MR</button>
                    <button class="red" sent="MC" py-click="CALCULATOR.clicked_button">MC</button>
                    <button class="red" sent="M+" py-click="CALCULATOR.clicked_button">M+</button>
                    <button class="red" sent="CE" py-click="CALCULATOR.clicked_button">CE</button>
                    <button class="pinky" sent="7" py-click="CALCULATOR.clicked_button">7</button>
                    <button class="pinky" sent="8" py-click="CALCULATOR.clicked_button">8</button>
                    <button class="pinky" sent="9" py-click="CALCULATOR.clicked_button">9</button>
                    <button class="green" sent="±" py-click="CALCULATOR.clicked_button">±</button>
                    <button class="green" sent="√" py-click="CALCULATOR.clicked_button">√</button>
                    <button class="pinky" sent="4" py-click="CALCULATOR.clicked_button">4</button>
                    <button class="pinky" sent="5" py-click="CALCULATOR.clicked_button">5</button>
                    <button class="pinky" sent="6" py-click="CALCULATOR.clicked_button">6</button>
                    <button class="green" sent="%" py-click="CALCULATOR.clicked_button">%</button>
                    <button class="green" sent="/" py-click="CALCULATOR.clicked_button">÷</button>
                    <button class="pinky" sent="1" py-click="CALCULATOR.clicked_button">1</button>
                    <button class="pinky" sent="2" py-click="CALCULATOR.clicked_button">2</button>
                    <button class="pinky" sent="3" py-click="CALCULATOR.clicked_button">3</button>
                    <button class="green" sent="*" py-click="CALCULATOR.clicked_button">×</button>
                    <button class="green" sent="-" py-click="CALCULATOR.clicked_button">-</button>
                    <button class="pinky" sent="0" py-click="CALCULATOR.clicked_button">0</button>
                    <button class="pinky" sent="00" py-click="CALCULATOR.clicked_button">00</button>
                    <button class="red" sent="." py-click="CALCULATOR.clicked_button">.</button>
                    <button class="green" sent="+" py-click="CALCULATOR.clicked_button">+</button>
                    <button class="green" sent="=" py-click="CALCULATOR.clicked_button">=</button>
                  </div>
                </div>
              </div>
              <p>(Try it out)</p>
            </div>

            <div class="description">
              <p>
                This PyQt-based calculator project showcases the use of Python in GUI design, event
                handling, and logic-based programming within a structured, object-oriented framework.
                All while creating a functional calculator.
              </p>

              <h3>Key Features:</h3>
              <ul>
                <li>User Interface Design with PyQt:
                  <ul>
                    Customized, interactive interface using PyQT’s QMainWindow, QFrame, and
                    QPushButton components, styled with color themes through PyQT's setStyleSheet
                    method, creating a clear visual distinction between different calculator functions.
                    <p class="subtext">
                      The in-browser demonstration recreates the interface using PyScript along with
                      HTML and CSS, without relying on PyQt functionality.
                    </p>
                  </ul>
                </li>
                <li>Event Handling & Functional Programming:
                  <ul>
                    Designed responsive button interactions with PyQT event handling, using partial
                    functions to associate specific operations with individual buttons, implementing
                    functionality for a wide range of calculator operations, including basic arithmetic,
                    memory functions, and error handling.
                  </ul>
                </li>
                <li>Code Structure & Object-Oriented Design:
                  <ul>
                    Class-based structure, encapsulating the calculator's components in a class for the main
                    window, and defining methods for specific functionalities (e.g., clear_mem, totaling,
                    add_operator), making the code modular, easier to expand, and straightforward to
                    maintain or modify.
                  </ul>
                </li>

              </ul>
              <p>
                This project demonstrates the ability to create visually intuitive applications, managing
                stateful interactions, and applying clean, organized code with GUI frameworks like PyQt.
              </p>
            </div>
          </div>
        </label>

      <div class="glass-card glass-sub">

        <label class="buffer" for="credit">
          <h3 class="expand">
            <img class="peek" src="static/img/ccpreview.png" alt="Credit Card Tool">
            Credit Card Management Tool
            <a href="https://github.com/JefeThePug/Credit_Card_Summary" title="Visit Credit Card Tool GitHub Repo"
               target="_blank">
              <iconify-icon class="md-link" icon="bxl:github"></iconify-icon>
            </a>
          </h3>

          <div class="tray game">
            <div class="terminalHolder">
              <div>
                <img class="project-img" src="static/img/ccpreview.png"
                     alt="Credit Card Management Tool Screenshot"/>
              </div>
            </div>

            <div class="description">
              <p>
                This project is a tool designed for scraping credit card purchase data from a bank's website,
                categorizing transactions, and generating detailed financial summaries in Excel. Utilizing
                Python for backend processing and integrating with Excel for user-friendly data management,
                this tool streamlines the process of tracking and analyzing expenses.
              </p>

              <h3>Key Features:</h3>
              <ul>
                <li>Web Scraping & Data Parsing:
                  <ul>
                    Employs Python libraries such as BeautifulSoup and Pandas to scrape and parse HTML
                    content from the bank's website. The tool extracts relevant purchase data, including
                    transaction dates, descriptions, and amounts, and organizes it into a structured
                    format suitable for analysis.
                  </ul>
                </li>
                <li>Excel Integration & Automation:
                  <ul>
                    Generates a comprehensive Excel file that allows users to view, modify, and categorize
                    their purchases. The project includes VBA scripts that automate data handling, enabling
                    users to easily manipulate the data and generate summaries based on custom categories.
                  </ul>
                </li>
                <li>Email Notification System:
                  <ul>
                    Implements an email notification system using Python's SMTP library. This feature
                    allows users to send the generated PDF summary directly from Excel to designated
                    recipient, ensuring that financial summaries are easily accessible.
                  </ul>
                </li>
                <li>AppleScript Integration:
                  <ul>
                    Incorporates AppleScript to execute Python scripts directly from within Excel. This
                    integration enhances the user experience by streamlining the process of generating PDF
                    reports and sending emails, making the tool more intuitive and user-friendly.
                  </ul>
                </li>
                <li>Customizable Categorization:
                  <ul>
                    Allows users to customize transaction categories through a user-friendly interface in
                    Excel. Users can modify the categorization logic in the Python script, ensuring that
                    the tool adapts to individual financial tracking needs.
                  </ul>
                </li>
              </ul>
              <p>
                This project showcases the ability to integrate web scraping, data manipulation, and GUI
                automation, demonstrating proficiency in Python programming, Excel VBA, and AppleScript. It
                provides a practical solution for financial tracking and analysis, empowering users to easily
                take control of their expenses.
              </p>
            </div>
          </div>
        </label>
      </div>

      <div class="glass-card glass-sub">
        <input type="checkbox" id="vet"/>
        <label class="buffer" for="vet">
          <h3 class="expand">
            <img class="peek" src="static/img/vet.png" alt="Vet Appointment Tool">
            Vet Appointment Web App
            <a href="https://github.com/JefeThePug/Vet-Appointment-Webapp"
               title="Visit Vet Appointment Web App GitHub Repo" target="_blank">
              <iconify-icon class="md-link" icon="bxl:github"></iconify-icon>
            </a>
          </h3>

          <div class="tray game">
            <div class="terminalHolder">
              <div>
                <img class="project-img" src="static/img/vet.png"
                     alt="Vet Appointment Web App Screenshot"/>
              </div>
            </div>

            <div class="description">
              <p>
                This project is a mock-up web application developed for the fictional "Dr. Pug Animal Clinic",
                aimed at facilitating the electronic management and scheduling of veterinary appointments.
                Leveraging Flask as the web framework and SQLite as the database, the app provides a
                user-friendly interface for clients to book appointments, eliminating the need for a
                receptionist and significantly streamlining the appointment process.
              </p>

              <h3>Key Features:</h3>
              <ul>
                <li>User Registration and Login:
                  <ul>
                    <li>
                      Secure account creation and authentication process, ensuring that only registered
                      users can access the appointment scheduling features.
                    </li>
                    <li>
                      Users can easily register with a username and password, with validation checks to
                      enhance security.
                    </li>
                  </ul>
                </li>
                <li>User Settings:
                  <ul>
                    <li>
                      Users can manage their personal information, including email addresses and
                      passwords, through a dedicated settings page.
                    </li>
                    <li>
                      Pet registration functionality allows users to add and manage their pets, ensuring
                      that appointments can only be made for registered pets.
                    </li>
                  </ul>
                </li>
                <li>Informative Pages:
                  <ul>
                    <li>
                      Doctors Page: Displays a list of available doctors at the clinic, complete with
                      photographs and short bios to help users make informed choices.
                    </li>
                    <li>
                      Access Page: Provides directions to the clinic, including a Google Maps embed for
                      easy navigation and public transportation information.
                    </li>
                    <li>
                      Hours Page: Clearly shows the clinic's hours of operation, which are dynamically
                      retrieved from the database.
                    </li>
                  </ul>
                </li>
                <li>Appointment Booking:
                  <ul>
                    <li>
                      Users can select their preferred doctor and pet from intuitive drop-down menus,
                      simplifying the booking process.
                    </li>
                    <li>
                      An availability chart displays the next five days segmented into thirty-minute
                      intervals, visually indicating availability with color-coded indicators:
                      <ul>
                        <li>Circle (◯): Lots of availability</li>
                        <li>Triangle (△): Limited availability</li>
                        <li>X (✕): No availability</li>
                      </ul>
                    </li>
                  </ul>
                </li>
                <li>Appointment Management:
                  <ul>
                    <li>
                      Users can view their upcoming appointments, with options to cancel or delete them
                      as needed.
                    </li>
                    <li>
                      Past appointments are also displayed for reference, allowing users to keep track of
                      their veterinary history.
                    </li>
                  </ul>
                </li>
              </ul>
              <p>
                This project showcases an integration of web development technologies, demonstrating
                proficiency in Python programming, use of the Flask framework, database management, and
                front-end design. The application not only enhances the efficiency of veterinary practices but
                also significantly improves the client experience by providing a seamless and user-friendly
                platform for managing pet healthcare appointments. The focus on usability and accessibility
                makes it a valuable tool for both the clinic and its clients.
              </p>
            </div>
          </div>
        </label>
      </div>

    <div class="OSS project-container">
      <div class="glass-card glass-sub">
        <input type="checkbox" id="bot"/>
        <label class="buffer" for="bot">
          <h3 class="expand">
            <img class="peek" src="static/img/bot.png" alt="Eos Bot">
            Practical Python Server Bot
            <a href="https://github.com/practical-python-org/Eos"

          <div class="tray game">
            <div class="terminalHolder">
              <div>
                <img class="project-img" src="static/img/bot.png"
                     alt="Practical Python Server Bot"/>
              </div>
            </div>

            <div class="description">
              <p>
                EosBot, known in production to users as Zorak, is the house bot for the Practical Python Discord
                server, designed to moderate, log, and provide both essential and fun features for the community.
                Eos is the bot's development name, while Zorak is its user-facing pseudonym. As an active
                contributor to this project, I have focused on enhancing the bot's functionality and improving
                user experience through various contributions.
              </p>

              <h3>My Contributions:</h3>
              <ul>
                <li>LaTeX Image Output:
                  <ul>
                    <li>
                      Implemented a command that integrates with a LaTeX API to output images, allowing
                      users to generate and display LaTeX-rendered content directly within the Discord
                      server.
                    </li>
                  </ul>
                </li>
                <li>User Onboarding Improvements:
                  <ul>
                    <li>
                      Enhanced the bot's handling of new users joining the server by streamlining the
                      onboarding process, ensuring a smoother introduction to the community's features
                      and functionalities and handling users who do not verify after one hour.
                    </li>
                  </ul>
                </li>
                <li>Message Translation Feature:
                  <ul>
                    <li>
                      Part of the team developing a message translation feature using the Google
                      Translate API, enabling users to communicate seamlessly across language barriers
                      within the server by automatically translating messages recognized to be in a
                      language other than English.
                    </li>
                  </ul>
                </li>
              </ul>

              <h3>General Responsibilities:</h3>
              <ul>
                <li>Code Review and PR Management:
                  <ul>
                    <li>
                      Assist in reviewing pull requests (PRs) to maintain high standards of code quality
                      and ensure proper feature integration.
                    </li>
                    <li>
                      Manage the backlog and task delegation using Kanban principles, facilitating an
                      efficient workflow among contributors.
                    </li>
                  </ul>
                </li>
                <li>Code Refactoring:
                  <ul>
                    <li>
                      Regularly refactor code to improve performance and maintainability, ensuring that
                      the codebase remains clean and efficient.
                    </li>
                  </ul>
                </li>
              </ul>

              <h3>Project Overview:</h3>
              <p>
                EosBot utilizes Py-Cord with cogged slash commands and integrates with a MongoDB database to
                provide features such as reaction roles, a points system, music functions, admin commands,
                full server logging, spam prevention, and raid protection. The bot is deployed using Docker,
                ensuring easy setup and management.
              </p>

              <p>
                Contributing to EosBot not only demonstrates my technical skills in Python and API
                integration but also highlights my commitment to collaborative software development and
                community engagement. I encourage others to join in the development process, as the project is
                open for contributions from anyone in the Practical Python community.
              </p>
            </div>
          </div>
        </label>
      </div>
    </div>
