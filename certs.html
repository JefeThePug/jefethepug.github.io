<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
        name="viewport"/>
  <meta http-equiv="X-UA-Compatible" content="ie=edge"/>
  <title>Jefe the Pug</title>
  <!-- Custom Stylesheets -->
  <link href="static/css/style.css" rel="stylesheet"/>
  <!-- Icons -->
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>

<body>
<div class="dot-grid" id="dotGrid"></div>

<main class="content">
  <div class="glass-card" id="top">
    <svg class="jefe" viewBox="0 0 256 200">
      <use href="static/img/logo.svg#jefe"></use>
    </svg>
    <div class="nav">
      <div tabindex="0">
        <a href="index.html">
          <iconify-icon id="nav-hom" icon="streamline-emojis:house-with-garden"></iconify-icon>
          <span>Home</span>
        </a>
      </div>
      <div tabindex="0">
        <a href="https://adventure.practicalpython.org" target="_blank">
          <iconify-icon id="nav-adv" icon="streamline-emojis:rocket"></iconify-icon>
          <span>Adventure</span>
        </a>
      </div>
      <div tabindex="0">
        <a href="games.html">
          <iconify-icon id="nav-gam" icon="streamline-emojis:game-dice"></iconify-icon>
          <span>Games</span>
        </a>
      </div>
      <div tabindex="0">
        <a href="projects.html">
          <iconify-icon id="nav-pro" icon="streamline-emojis:briefcase"></iconify-icon>
          <span>Projects</span>
        </a>
      </div>
      <div tabindex="0">
        <a href="certs.html">
          <iconify-icon id="nav-cer" icon="streamline-emojis:clipboard"></iconify-icon>
          <span>Certificates</span>
        </a>
      </div>
      <div tabindex="0">
        <a href="contact.html">
          <iconify-icon id="nav-mai" icon="streamline-emojis:open-mailbox-with-raised-flag"></iconify-icon>
          <span>Contact</span>
        </a>
      </div>
    </div>
    <div class="toggle-group">
      <input type="radio" name="mode" id="light-mode" value="light"/>
      <label for="light-mode">
        <iconify-icon icon="noto:sun"></iconify-icon>
      </label>
      <input type="radio" name="mode" id="dark-mode" value="dark" checked/>
      <label for="dark-mode">
        <iconify-icon icon="noto:crescent-moon"></iconify-icon>
      </label>
      <input type="radio" name="mode" id="pink-mode" value="pink"/>
      <label for="pink-mode">
        <iconify-icon icon="fluent-emoji-flat:unicorn"></iconify-icon>
      </label>
    </div>
  </div>

  <div class="glass-card glass-memo">
    <p>
      Verifiable certificates, with name and certificate number,
      are available upon request.
    </p>
  </div>

  <div class="glass-card content-block">
    <h1>Courses</h1>
    <div class="courses cert-container">
      <div class="glass-card glass-sub">
        <input type="checkbox" id="python_ud"/>
        <label class="buffer" for="python_ud">
          <h3 class="expand">Python Course (Udemy)</h3>
          <div class="tray cert">
            <img
                class="certificate"
                src="static/img/certs/python_ud.png"
                alt="Python Course Certificate"
            />
            <ul class="points">
              <li>
                <span class="bold">Basic Syntax</span>: Understanding Python
                syntax, variables, functions, arguments, scope, and data types.
              </li>
              <li>
                <span class="bold">Modules</span>: Importing and using modules,
                writing custom modules.
              </li>
              <li>
                <span class="bold">File I/O</span>: Reading from and writing to
                files.
              </li>
              <li>
                <span class="bold">Error Handling</span>: Using try-except blocks,
                raising exceptions.
              </li>
              <li>
                <span class="bold">Object-Oriented Programming</span>: Creating
                classes, inheritance, polymorphism.
              </li>
              <li>
                <span class="bold">Advanced Features</span>: Decorators,
                generators, context managers.
              </li>
              <li>
                <span class="bold">Libraries</span>: Using popular libraries like
                NumPy, Pandas, Matplotlib.
              </li>
              <li>
                <span class="bold">Web Scraping</span>: Extracting data from
                websites using the requests module, BeautifulSoup and Selenium.
              </li>
              <li>
                <span class="bold">Automation</span>: Automating tasks with Python
                scripts.
              </li>
              <li>
                <span class="bold">GUI Development</span>: Creating graphical user
                interfaces with Jupyter Notebooks widgets.
              </li>
              <li>
                <span class="bold">PIL</span>: Working with images using the Python
                Imaging Library (Pillow).
              </li>
              <li>
                <span class="bold">Content</span>: Three real-world project
                assignments and numerous tests and quizzes.
              </li>
            </ul>
          </div>
        </label>
      </div>

      <div class="glass-card glass-sub">
        <input type="checkbox" id="sql_ud"/>
        <label class="buffer" for="sql_ud">
          <h3 class="expand">SQL Course (Udemy)</h3>
          <div class="tray cert">
            <img
                class="certificate"
                src="static/img/certs/sql_ud.png"
                alt="SQL Course Certificate"
            />
            <ul class="points">
              <li>
                <span class="bold">Introduction to SQL</span>: Understanding SQL
                syntax and writing basic queries.
              </li>
              <li>
                <span class="bold">Database Management</span>: Types of databases
                and database management systems, focusing on PostgreSQL.
              </li>
              <li>
                <span class="bold">CRUD Operations</span>: Create, Read, Update,
                Delete operations in SQL.
              </li>
              <li>
                <span class="bold">Data Analysis</span>: Using SQL for data
                analysis with real-world examples.
              </li>
              <li>
                <span class="bold">Advanced Queries</span>: Running advanced
                queries with string operations, comparison operations, and
                logical operators.
              </li>
              <li>
                <span class="bold">Aggregate Functions and Joins</span>: Analyzing
                data using aggregate functions with GROUP BY commands.
                Performing joins to combine data from multiple tables.
              </li>
              <li>
                <span class="bold">Subqueries</span>: Using subqueries to retrieve
                data from one or more tables.
              </li>
              <li>
                <span class="bold">Database Design</span>: Designing and optimizing
                databases for performance.
              </li>
              <li>
                <span class="bold">Content</span>: Mock questions and tips to ace
                SQL interviews and application of SQL skills to real-world
                projects.
              </li>
            </ul>
          </div>
        </label>
      </div>

      <div class="glass-card glass-sub">
        <input type="checkbox" id="docker_ud"/>
        <label class="buffer" for="docker_ud">
          <h3 class="expand">Docker Course (Udemy)</h3>
          <div class="tray cert">
            <img
                class="certificate"
                src="static/img/certs/docker_ud.png"
                alt="Docker Certificate"
            />
            <ul class="points">
              <li>
                <span class="bold">Docker Fundamentals</span>: Introduction to
                Docker and containerization concepts.
              </li>
              <li>
                <span class="bold">Container Management</span>: Managing Docker
                containers using the CLI.
              </li>
              <li>
                <span class="bold">Docker Objects and Commands</span>:
                Understanding and using the most common Docker objects and
                commands.
              </li>
              <li>
                <span class="bold">Dockerfile Writing</span>: Writing Dockerfiles
                to build images.
              </li>
              <li>
                <span class="bold">Docker Image Creation and Management</span>:
                Creating, managing, and pushing Docker images to Docker Hub.
              </li>
              <li>
                <span class="bold">Docker Container Creation and Management</span>:
                Creating, starting, stopping, and managing Docker containers.
              </li>
              <li>
                <span class="bold">Docker Network Creation and Management</span>:
                Configuring Docker networks and managing container networking.
              </li>
              <li>
                <span class="bold">Docker Volume Creation and Management</span>:
                Using Docker volumes to manage container data.
              </li>
              <li>
                <span class="bold">Real-World Projects</span>: Applying Docker
                skills to real-world projects.
              </li>
            </ul>
          </div>
        </label>
      </div>

      <div class="glass-card glass-sub">
        <input type="checkbox" id="dotnet_ud"/>
        <label class="buffer" for="dotnet_ud">
          <h3 class="expand">C# .NET Course (Udemy)</h3>
          <div class="tray cert">
            <img
                class="certificate"
                src="static/img/certs/dotnet_ud.png"
                alt=".NET Certificate"
            />
            <ul class="points">
              <li>
                <span class="bold">ASP.NET Core Fundamentals</span>: Introduction
                to ASP.NET Core and Minimal API development.
              </li>
              <li>
                <span class="bold">Minimal APIs</span>: Building lightweight REST
                APIs using ASP.NET Core Minimal APIs.
              </li>
              <li>
                <span class="bold">Endpoint Creation and Routing</span>: Creating
                and organizing API endpoints with route handling.
              </li>
              <li>
                <span class="bold">Entity Framework Core</span>: Working with EF
                Core for database access and ORM functionality.
              </li>
              <li>
                <span class="bold">Database Integration</span>: Configuring and
                managing databases within .NET applications.
              </li>
              <li>
                <span class="bold">Dependency Injection</span>: Using dependency
                injection to structure scalable applications.
              </li>
              <li>
                <span class="bold">Global Error Handling</span>: Implementing
                centralized exception handling and consistent API error
                responses.
              </li>
              <li>
                <span class="bold">Authentication and Authorization</span>:
                Implementing user authentication and securing API endpoints.
              </li>
              <li>
                <span class="bold">API Testing and Documentation</span>: Testing
                endpoints and working with Scalar/OpenAPI tools.
              </li>
              <li>
                <span class="bold">Real-World API Development</span>: Applying .NET
                backend development skills to practical projects.
              </li>
            </ul>
          </div>
        </label>
      </div>

      <div class="glass-card glass-sub">
        <input type="checkbox" id="cs50"/>
        <label class="buffer" for="cs50">
          <h3 class="expand">Harvard's CS50</h3>
          <div class="tray cert">
            <img
                class="certificate"
                src="static/img/certs/cs50.png"
                alt="CS50 Certificate"
            />
            <ul class="points">
              <li>
                <span class="bold">Abstraction</span>: Learning to break down
                complex problems and systems into smaller, more manageable
                parts. This includes understanding how abstraction applies to
                both algorithms and data.
              </li>
              <li>
                <span class="bold">Algorithms</span>: Designing and analyzing
                algorithms for efficiency and effectiveness. You'll delve into
                concepts like sorting and searching, and the trade-offs between
                different algorithmic approaches. Time and Space complexity.
              </li>
              <li>
                <span class="bold">Data Structures</span>: Exploring essential data
                structures such as arrays, linked lists, stacks, queues, hash
                tables, and tries, and understanding how they are used to store
                and organize data efficiently.
              </li>
              <li>
                <span class="bold">Encapsulation</span>: Grasping the principles of
                encapsulation in programming, which involves bundling data with
                the methods that operate on that data, and understanding why
                it's crucial for writing maintainable code.
              </li>
              <li>
                <span class="bold">Resource Management</span>: Learning how to
                manage computer resources like memory and processing power. This
                includes understanding memory allocation, pointers, and dynamic
                memory management.
              </li>
              <li>
                <span class="bold">Security</span>: Introduction to computer
                security, covering basic principles like cryptography, network
                security, and the importance of writing secure code to protect
                against vulnerabilities.
              </li>
              <li>
                <span class="bold">Web Development</span>: Basics of web
                development using HTML, CSS, and JavaScript. Web frameworks like
                Flask are covered with how to build dynamic web applications.
              </li>
              <li>
                <span class="bold">Programming Languages</span>: Familiarity with
                multiple programming languages such as C, Python, SQL, and
                JavaScript, each used to demonstrate different concepts and
                solve various types of problems.
              </li>
              <li>
                <span class="bold">Problem-Solving</span>: Developing strong
                problem-solving skills through algorithmic thinking and
                structured approaches to tackling complex challenges.
              </li>
              <li>
                <span class="bold">Real-World Projects</span>: Applying learned
                concepts to practical projects that mimic real-world problems,
                reinforcing the theoretical knowledge with hands-on experience.
              </li>
              <li>
                <span class="bold">Final Project</span>: Creating and presenting a
                final programming project that showcases understanding of course
                materials and the ability to apply them in a practical context.
              </li>
            </ul>
          </div>
        </label>
      </div>
    </div>
  </div>

  <div class="glass-card content-block">
    <h1>Skill Completion</h1>
    <div class="courses cert-container">
      <div class="glass-card glass-sub">
        <input type="checkbox" id="python_hr"/>
        <label class="buffer" for="python_hr">
          <h3 class="expand">Python Skill Test (HackerRank)</h3>
          <div class="tray cert">
            <img
                class="certificate"
                src="static/img/certs/python_hr.png"
                alt="Python Certificate"
            />
            <ul class="points">
              <li>
                <span class="bold">Scalar Types and Operators</span>: Understanding
                basic data types and operators.
              </li>
              <li>
                <span class="bold">Control Flow</span>: Using if-else, loops, and
                conditionals to control flow.
              </li>
              <li>
                <span class="bold">Strings</span>: Manipulating and working with
                strings.
              </li>
              <li>
                <span class="bold">Collections and Iteration</span>: Working with
                lists, dictionaries, sets, and tuples.
              </li>
              <li>
                <span class="bold">Modularity</span>: Writing functions and
                organizing code into modules.
              </li>
              <li>
                <span class="bold">Objects and Classes</span>: Understanding
                object-oriented programming concepts, including creating and
                using classes.
              </li>
            </ul>
          </div>
        </label>
      </div>

      <div class="glass-card glass-sub">
        <input type="checkbox" id="sql1_hr"/>
        <label class="buffer" for="sql1_hr">
          <h3 class="expand">SQL Skill Test Beginner (HackerRank)</h3>
          <div class="tray cert">
            <img
                class="certificate"
                src="static/img/certs/sql1_hr.png"
                alt="SQL Basic Certificate"
            />
            <ul class="points">
              <li>
                <span class="bold">Basic SQL Queries</span>: Writing simple SELECT
                queries to retrieve data from single tables.
              </li>
              <li>
                <span class="bold">Filtering and Sorting</span>: Using WHERE
                clauses, ORDER BY, and LIMIT to filter and sort query results.
              </li>
              <li>
                <span class="bold">Aggregations</span>: Applying functions like
                COUNT, SUM, AVG, MIN, and MAX to aggregate data.
              </li>
              <li>
                <span class="bold">Joins</span>: Performing simple joins (INNER
                JOIN) to combine data from multiple tables.
              </li>
              <li>
                <span class="bold">Group By and Having</span>: Grouping data and
                filtering groups using the GROUP BY and HAVING clauses.
              </li>
            </ul>
          </div>
        </label>
      </div>

      <div class="glass-card glass-sub">
        <input type="checkbox" id="sql2_hr"/>
        <label class="buffer" for="sql2_hr">
          <h3 class="expand">SQL Skill Test Intermediate (HackerRank)</h3>
          <div class="tray cert">
            <img
                class="certificate"
                src="static/img/certs/sql2_hr.png"
                alt="SQL Intermediate Certificate"
            />
            <ul class="points">
              <li>
                <span class="bold">Advanced Joins</span>: Mastering more complex
                joins such as LEFT JOIN, RIGHT JOIN, and FULL OUTER JOIN.
              </li>
              <li>
                <span class="bold">Subqueries</span>: Writing subqueries to perform
                more complex data retrievals and manipulations.
              </li>
              <li>
                <span class="bold">Set Operations</span>: Using UNION, UNION ALL,
                INTERSECT, and EXCEPT to combine results from multiple queries.
              </li>
              <li>
                <span class="bold">Aggregations and Window Functions</span>:
                Advanced use of aggregation functions and introduction to window
                functions for more complex calculations.
              </li>
              <li>
                <span class="bold">Data Modifications</span>: Writing INSERT,
                UPDATE, and DELETE statements to modify data in tables.
              </li>
              <li>
                <span class="bold">Indexing and Performance Tuning</span>:
                Understanding basic indexing and how to optimize query
                performance.
              </li>
            </ul>
          </div>
        </label>
      </div>
    </div>
  </div>

  <div class="glass-card content-block">
    <h1>Examinations</h1>
    <div class="courses cert-container">
      <div class="glass-card glass-sub">
        <input type="checkbox" id="sql3_hr"/>
        <label class="buffer" for="sql3_hr">
          <h3 class="expand">SQL Skill Test Advanced (HackerRank)</h3>
          <div class="tray cert">
            <img
                class="certificate"
                src="static/img/certs/sql3_hr.png"
                alt="SQL Advanced Certificate"
            />
            <ul class="points">
              <li>
                <span class="bold">Joins and Set Operations</span>: Mastery of
                complex joins (like CROSS JOIN) and set operations (UNION,
                INTERSECT, EXCEPT) to manipulate data across tables.
              </li>
              <li>
                <span class="bold">Subqueries</span>: Using advanced subqueries,
                including correlated subqueries, to solve intricate querying
                needs.
              </li>
              <li>
                <span class="bold">Query Optimization</span>: Enhancing performance
                through query optimization and analysis.
              </li>
              <li>
                <span class="bold">Common Table Expressions (CTEs)</span>:
                Simplifying complex queries and handling recursive queries with
                CTEs.
              </li>
              <li>
                <span class="bold">Window Functions</span>: Utilizing functions
                like ROW_NUMBER and RANK for advanced row-by-row calculations.
              </li>
            </ul>
          </div>
        </label>
      </div>

      <div class="glass-card glass-sub">
        <input type="checkbox" id="sei_hr"/>
        <label class="buffer" for="sei_hr">
          <h3 class="expand">Software Engineer Intern (HackerRank)</h3>
          <div class="tray cert">
            <img
                class="certificate"
                src="static/img/certs/sei_hr.png"
                alt="Software Engineer Intern Certificate"
            />
            <ul class="points">
              <li>
                <span class="bold">Problem-Solving:</span> solve coding problems
                using various algorithms and data structures.
              </li>
              <li>
                <span class="bold">SQL:</span> knowledge of SQL, including writing
                queries, database design, normalization, and optimization
                techniques.
              </li>
              <li>
                <span class="bold">Code Quality:</span> coding style, readability,
                and adherence to best practices.
              </li>
              <li>
                <span class="bold">Technical Communication:</span> ability to
                explain thought processes and solutions, demonstrating the
                ability to communicate technical concepts clearly.
              </li>
            </ul>
          </div>
        </label>
      </div>
    </div>
  </div>

  <div class="blank"></div>
</main>

<footer>

</body>
